name: alpfitplus-web

services:
  # Gelistirme sunucusu — http://localhost:3000
  web:
    build:
      context: .
      target: dev
    container_name: alpfitplus-web-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      # NODE_ENV bilerek TANIMLANMADI — next dev ve next build kendi degerini koyar.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev
    restart: unless-stopped

  # Uretim imajinin yerelde dogrulanmasi — http://localhost:3001
  web-prod:
    build:
      context: .
      target: runner
    container_name: alpfitplus-web-prod
    ports:
      - "3100:3000"
    profiles: ["prod"]
    restart: unless-stopped

  # Playwright: rakip analizi, ekran goruntusu, gorsel regresyon
  research:
    build:
      context: .
      dockerfile: Dockerfile.research
    container_name: alpfitplus-research
    volumes:
      - ./research:/work
    working_dir: /work
    network_mode: host
    profiles: ["research"]
    stdin_open: true
    tty: true

volumes:
  node_modules:
  next_cache:
