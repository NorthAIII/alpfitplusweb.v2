name: alpfitplus-web

services:
  # Gelistirme sunucusu — http://localhost:3000
  web:
    build:
      context: .
      target: dev
    container_name: alpfitplus-web-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      # Yasal beyan kapisinin CAPRAZ DEPO dali (TASK-2.19, B-060). Yayindaki
      # "12 ay" saklama cumlesinin mekanizmasi bu repoda DEGIL, v1'in
      # PocketBase hook'larinda yasar (lead_lib.js -> RETENTION_MONTHS).
      # Sabiti v2'ye kopyalamak reddedildi (PHASE-2 -> Secilen Yaklasimlar 4):
      # kopya, bulgunun sikayet ettigi tekrarin ta kendisi olurdu.
      #
      # :ro ZORUNLUDUR — komsu depo CANLI SITEDIR ve dokunulmazdir (CLAUDE.md
      # -> Dokunulmazlar). Testin kendisi de bunu olcer: baglama yazilabilir
      # gelirse dal kirilir (access(W_OK) -> EROFS beklenir; olculdu 2026-09-23,
      # rw baglamada ayni sonda geciyor, yani ayirt ediyor).
      #
      # HEDEF /app'IN DISINDA — bilincli. /app deponun kendi bind-mount'u;
      # icine acilan bir baglama noktasi HOST'ta, yani repoda, root sahipli
      # bos bir dizin BIRAKIR (olculdu 2026-09-23: /app/ic-baglama repoda kaldi,
      # /opt/... hicbir iz birakmadi — memory/arastirma-konteynerinde-tarayici-
      # olcumu.md'nin `/work` tuzaginin ayni sinifi).
      #
      # Kaynak dizin bu makinede VAR. Baska bir makinede yoksa compose onu
      # root sahipli BOS dizin olarak yaratir ve konteyner yine kalkar
      # (olculdu 2026-09-23) — bos baglamada test dali sessizce gecmez,
      # "dayanak dosyasi yok" diyerek KIRILIR (fail-closed). Ayni kaynagi
      # ayni bicimde `lead-store` servisi de bagliyor (TASK-1.17).
      - ../Alpfitplus-website.v1/pocketbase/pb_hooks:/opt/v1-pb-hooks:ro
    environment:
      # NODE_ENV bilerek TANIMLANMADI — next dev ve next build kendi degerini koyar.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev
    restart: unless-stopped

  # Uretim imajinin yerelde dogrulanmasi — http://localhost:3100
  #
  # Yerel uretim provasi BILINCLI olarak HEDEFSIZDIR (B-058, TASK-2.02). Once
  # bu blokta hic env yoktu; konteyner imaja sizmis `.env`'i okuyup /api/demo
  # istegini sessizce bir depoya yaziyordu. `.dockerignore` artik `.env`'i
  # disarida birakiyor, bu blok da niyeti YAZILI hale getirir.
  #
  # Asagidaki uc anahtarin her biri kendi yolunun BASIDIR ve bos oldugunda o
  # yol hic denenmez (fail-closed — src/app/api/demo/route.ts): depo (toStore),
  # yerel JSONL dosyasi (toFile), e-posta (toEmail). Ucu de bos oldugu icin uc
  # durustce 503 `no-sink` doner (M3 F3.1 kabul kriteri) ve 3100'e bakan olcum
  # turlari (perf.mjs, font-guard.mjs) hicbir yere kayit yazmaz.
  #
  # Bos deger dekoratif DEGIL, ikinci katmandir: Next'in dotenv yukleyicisi
  # yalnizca process.env'de HIC TANIMLI OLMAYAN anahtari doldurur (@next/env
  # -> processEnv, `typeof p[t]==="undefined"` kapisi; kod okunarak olculdu,
  # TASK-2.02). Yani `.env` bir gun imaja geri sizsa bile bu uc anahtar bos
  # kalir ve prova hedefsiz kalmaya devam eder.
  #
  # Gercek bir depoya karsi prova gerekirse `--profile lead` ile lead-store
  # kaldirilir ve buraya LEAD_STORE_URL=http://lead-store:8090 + LEAD_STORE_TOKEN
  # + IP_HASH_SALT yazilir (port host'a yayinlanmaz, adres compose agi icinden).
  # CANLI depo adresi/token'i buraya ASLA yazilmaz.
  web-prod:
    build:
      context: .
      target: runner
    container_name: alpfitplus-web-prod
    ports:
      - "3100:3000"
    profiles: ["prod"]
    environment:
      LEAD_STORE_URL: ""
      LEAD_FILE_PATH: ""
      RESEND_API_KEY: ""
    restart: unless-stopped

  # Playwright: rakip analizi, ekran goruntusu, gorsel regresyon
  research:
    build:
      context: .
      dockerfile: Dockerfile.research
    container_name: alpfitplus-research
    volumes:
      - ./research:/work
    working_dir: /work
    network_mode: host
    profiles: ["research"]
    stdin_open: true
    tty: true

  # Lead deposu yerel provasi (TASK-1.17) — v1'in canli PocketBase'inin birebir
  # kopyasi. Imaj v1'in kendi Dockerfile'indan derlenir, pb_hooks ve pb_migrations
  # v1 reposundan SALT OKUNUR baglanir — o repoda hicbir dosya degismez. Koleksiyon
  # semasini migration'lar kendisi kurar, tohum gerekmez. Varsayilan `up`'ta KALKMAZ
  # (profil: lead) — `docker compose --profile lead up -d lead-store` gerekir.
  #
  # Port host'a YAYINLANMAZ (v1'in kendi deseni) — erisim yalniz compose agi
  # icinden: http://lead-store:8090. Token'lar `:-` ile bos varsayilir (v1'in
  # `:?` deseni BILEREK kullanilmaz) — yoksa .env'i olmayan biri `docker compose
  # up -d web` bile kosamazdi. Bos/tanimsiz token slotu KAPALIDIR: resolveTarget
  # (lead_lib.js) bos env degerini eslemez, her istek 401 alir — fail-closed.
  lead-store:
    build:
      context: ../Alpfitplus-website.v1/pocketbase
      args:
        PB_VERSION: "0.39.9"
    container_name: alpfitplus-lead-store
    profiles: ["lead"]
    restart: unless-stopped
    environment:
      LEAD_TOKEN_PRODUCTION: ${LEAD_TOKEN_PRODUCTION:-}
      LEAD_TOKEN_PREVIEW: ${LEAD_TOKEN_PREVIEW:-}
    volumes:
      # Lead verisi burada yasar — isimli, atilabilir hacim. v1'in `alpfit_pb_data`
      # adi KULLANILMAZ (ayri ortam, karisma riski yok ama isim de ayri).
      - lead_store_data:/pb/pb_data
      # Hook ve migration v1 reposundan SALT OKUNUR. v1'in kendi compose'u
      # migrations'i yazilabilir baglar (panelden sema degisikligi icin); bu
      # yerel provada sema degisikligi panelden yapilmaz, ikisi de :ro yeter.
      - ../Alpfitplus-website.v1/pocketbase/pb_hooks:/pb/pb_hooks:ro
      - ../Alpfitplus-website.v1/pocketbase/pb_migrations:/pb/pb_migrations:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  node_modules:
  next_cache:
  lead_store_data:
